# ESSENCE Token Dashboard — Docker Compose Stack
# Deploys: PostgreSQL + OTLP Receiver + Aspire Dashboard + Dashboard Updater
#
# Usage:
#   cp .env.example .env   # then edit .env with your values
#   docker compose up -d
#   docker compose down
#
# Environment variable ESSENCE_DASHBOARD_DIR must point to the directory
# containing essence-token-dashboard.html (set by setup.py automatically).

services:
  # PostgreSQL — persistent telemetry store
  postgres:
    image: postgres:16-alpine
    container_name: essence-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-essence_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-essence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432" # Host port 5433 (loopback-only) to avoid conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U essence -d essence_telemetry" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # OTLP Receiver — parses spans, stores in PostgreSQL, forwards to Aspire
  receiver:
    build: ./receiver
    container_name: essence-receiver
    ports:
      - "127.0.0.1:4318:4318" # VS Code sends OTLP here (loopback-only)
    environment:
      ASPIRE_OTLP_URL: http://aspire:18890
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-essence_telemetry}
      DB_USER: ${POSTGRES_USER:-essence}
      DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  # Aspire Dashboard — real-time trace viewer
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    ports:
      - "127.0.0.1:18888:18888" # Dashboard UI (loopback-only)
    environment:
      ASPNETCORE_URLS: http://+:18888
      DOTNET_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://+:18890
      DASHBOARD__API__PRIMARYAPIKEY: ${ASPIRE_API_KEY:?Set ASPIRE_API_KEY in .env}

  # Update Server — triggers dashboard refresh from browser button
  updater:
    build:
      context: .
      dockerfile: updater.Dockerfile
    container_name: essence-updater
    ports:
      - "127.0.0.1:4319:4319" # Refresh Data button calls this (loopback-only)
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-essence_telemetry}
      DB_USER: ${POSTGRES_USER:-essence}
      DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DASHBOARD_PATH: /dashboard/essence-token-dashboard.html
      DASHBOARD_TZ_OFFSET_HOURS: ${DASHBOARD_TZ_OFFSET_HOURS:-3}
      UPDATE_SERVER_BIND: "0.0.0.0"
      UPDATE_SERVER_PORT: "4319"
    volumes:
      - type: bind
        source: ${ESSENCE_DASHBOARD_DIR:-.}
        target: /dashboard
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: essence-telemetry-pgdata
