<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="900" fill="#1a1a24"/>
  
  <!-- Define hexagon path for reuse -->
  <defs>
    <path id="hexagon" d="M 0,-57.735 L 50,-28.8675 L 50,28.8675 L 0,57.735 L -50,28.8675 L -50,-28.8675 Z"/>
  </defs>
  
  <!-- Top row (4 hexagons) -->
  <!-- Cyan -->
  <g transform="translate(200, 160)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Blue -->
  <g transform="translate(310, 160)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Purple -->
  <g transform="translate(420, 160)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Cyan -->
  <g transform="translate(530, 160)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Second row (3 hexagons) -->
  <!-- Purple -->
  <g transform="translate(255, 255)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Cyan (large central) -->
  <g transform="translate(365, 255) scale(1.3)">
    <use href="#hexagon" fill="#00e5ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Blue -->
  <g transform="translate(475, 255)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Third row (2 hexagons) -->
  <!-- Blue -->
  <g transform="translate(310, 350)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Purple -->
  <g transform="translate(420, 350)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Bottom hexagon -->
  <!-- Cyan -->
  <g transform="translate(365, 445)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Typography -->
  <text x="400" y="620" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">essence</text>
  <text x="400" y="690" font-family="Arial, sans-serif" font-size="50" font-weight="normal" fill="#00e5ff" text-anchor="middle">10</text>
  <text x="400" y="730" font-family="Arial, sans-serif" font-size="12" fill="#808099" text-anchor="middle" letter-spacing="2">MULTI-AGENT DEVELOPMENT PLATFORM</text>
</svg>
