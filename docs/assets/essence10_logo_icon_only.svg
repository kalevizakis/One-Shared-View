<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a24"/>
  
  <!-- Define hexagon path for reuse -->
  <defs>
    <path id="hexagon" d="M 0,-57.735 L 50,-28.8675 L 50,28.8675 L 0,57.735 L -50,28.8675 L -50,-28.8675 Z"/>
  </defs>
  
  <!-- Top row (4 hexagons) -->
  <g transform="translate(200, 150)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(310, 150)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(420, 150)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(530, 150)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Second row (3 hexagons) -->
  <g transform="translate(255, 245)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(365, 245) scale(1.3)">
    <use href="#hexagon" fill="#00e5ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(475, 245)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Third row (2 hexagons) -->
  <g transform="translate(310, 340)">
    <use href="#hexagon" fill="#0080ff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <g transform="translate(420, 340)">
    <use href="#hexagon" fill="#9d6cff" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Bottom hexagon -->
  <g transform="translate(365, 435)">
    <use href="#hexagon" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
